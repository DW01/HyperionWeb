<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glide - Hyperion Engine</title>
  <meta name="description" content="Glide Sample for Hyperion Engine.">
  <link rel="canonical" href="https://hyperionengine.dev/GlideSample/">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .brand { display: inline-flex; }

    .game-page { padding: 28px 0 48px; }

    .game-page h1 { font-size: 28px; margin: 0 0 16px; }
    .game-page h1 span { color: var(--muted); font-size: 16px; font-weight: 400; margin-left: 8px; }

    .game-frame { position: relative; background: #000; }

    .game-frame canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      outline: none;
    }

    .game-frame:fullscreen { display: flex; align-items: center; }
    .game-frame:fullscreen canvas { height: 100%; object-fit: contain; }

    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #000;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    #status[hidden] { display: none; }

    .game-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px 24px;
      flex-wrap: wrap;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .game-bar b { color: var(--text); font-weight: 600; }

    #fullscreen {
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    #fullscreen:hover { color: var(--text); }

    #touch {
      position: absolute;
      inset: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #touch[hidden] { display: none; }

    .touch-hint {
      position: absolute;
      bottom: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      transition: opacity 0.6s;
    }

    .touch-hint.left { left: 16px; }
    .touch-hint.right { right: 16px; }

    #touch.used .touch-hint { opacity: 0; }

    #stick {
      position: absolute;
      width: 72px;
      height: 72px;
      margin: -36px 0 0 -36px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      pointer-events: none;
    }

    #stick::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: translate(var(--dx, 0), var(--dy, 0));
    }

    #stick[hidden] { display: none; }

    #rotate-hint { display: none; }

    @media (orientation: portrait) {
      #rotate-hint { display: inline; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Hyperion Engine"><img src="/assets/hyperion-logo.png" alt="" width="382" height="105"></a>
      <nav class="nav" aria-label="Primary">
        <a href="/#features">Features</a>
        <!-- <a href="/strata.html">Strata</a> -->
        <a href="/samples.html">Samples</a>
        <a href="/docs/">Docs</a>
        <a class="nav-github" href="https://github.com/HyperionGameTech/HyperionEngine" rel="noopener" aria-label="Hyperion Engine on GitHub" title="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      </nav>
    </div>
  </header>

  <main class="wrap game-page">
    <h1>Glide <span>sample game</span></h1>

    <div id="frame" class="game-frame">
      <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Glide"></canvas>
      <div id="touch" hidden>
        <div class="touch-hint left">Drag to steer</div>
        <div class="touch-hint right">Hold to boost</div>
        <div id="stick" hidden></div>
      </div>
      <div id="status">Loading content...</div>
    </div>

    <div class="game-bar">
      <span id="keys-help"><b>Space</b> - start &nbsp; <b>WASD</b> / <b>arrows</b> - steer &nbsp; <b>Shift</b> - boost &nbsp; <b>I</b> - invert controls</span>
      <span id="touch-help" hidden><b>Tap</b> - start &nbsp; <b>Drag left side</b> - steer &nbsp; <b>Hold right side</b> - boost</span>
      <button id="fullscreen" type="button">Fullscreen</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>Hyperion Engine</span>
      <nav aria-label="Footer">
        <a href="/#features">Features</a>
        <!-- <a href="/strata.html">Strata</a> -->
        <a href="/samples.html">Samples</a>
        <a href="/docs/">Docs</a>
        <a href="https://github.com/HyperionGameTech/HyperionEngine" rel="noopener">GitHub</a>
      </nav>
    </div>
  </footer>

<script>
    const canvasElement = document.getElementById('canvas');
    const frameElement = document.getElementById('frame');
    const statusElement = document.getElementById('status');

    let isRunning = false;

    function showStatus(text)
    {
        statusElement.textContent = text;
        statusElement.hidden = false;
    }

    function onFirstFrames()
    {
        if (!isRunning)
        {
            isRunning = true;
            statusElement.hidden = true;
            canvasElement.focus();
        }
    }

    // the scene is on screen by the time GI starts up
    function onEngineLog(text)
    {
        if (!isRunning && text.indexOf(isTouchDevice ? 'GlideGame launched' : 'Glimmer start: SH') >= 0)
        {
            onFirstFrames();
        }
    }

    const isTouchDevice = matchMedia('(hover: none) and (pointer: coarse)').matches;

    const mobileVariables = [
        'Rendering.Glimmer.Enabled=false',
        'Rendering.SSR=false',
        'Rendering.GTAO=false',
        'Rendering.Clouds=false',
        'Rendering.FogVolumes=false',
        'Rendering.Shadows.CSMMaxDistance=200',
        'Rendering.Shadows.CSMMaxStaleFrames=16'
    ];

    var Module = {
        canvas: canvasElement,
        arguments: (isTouchDevice ? mobileVariables : []).concat(new URLSearchParams(location.search).getAll('set')),
        print: (text) => { console.log(text); onEngineLog(text); },
        printErr: (text) => { console.warn(text); onEngineLog(text); },
        setStatus: (text) => {
            if (isRunning)
            {
                return;
            }

            if (!text)
            {
                showStatus('Starting...');
                setTimeout(onFirstFrames, 30000);

                return;
            }

            const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
            const percent = match ? Math.floor(100 * parseFloat(match[1]) / parseFloat(match[2])) : NaN;

            showStatus(percent >= 0 && percent <= 100 ? 'Loading ' + percent + '%' : 'Loading...');
        },
        onAbort: (reason) => showStatus('Something went wrong: ' + reason)
    };

    window.addEventListener('keydown', (event) => {
        const isBrowserShortcut = event.ctrlKey || event.metaKey || /^F\d+$/.test(event.code);

        if (document.activeElement === canvasElement && !isBrowserShortcut)
        {
            event.preventDefault();
        }
    });

    canvasElement.addEventListener('wheel', (event) => event.preventDefault(), { passive: false });
    canvasElement.addEventListener('contextmenu', (event) => event.preventDefault());
    frameElement.addEventListener('mousedown', () => canvasElement.focus());

    document.getElementById('fullscreen').addEventListener('click', () => {
        frameElement.requestFullscreen().then(() => canvasElement.focus()).catch(() => {});
    });

    function setUpTouchControls()
    {
        const touchElement = document.getElementById('touch');
        const stickElement = document.getElementById('stick');
        const deadZone = 14;
        const stickReach = 24;
        const heldCodes = new Set();

        let steerTouch = null;
        let boostTouchId = null;
        let hasAskedForFullscreen = false;

        touchElement.hidden = false;
        document.getElementById('keys-help').hidden = true;
        document.getElementById('touch-help').hidden = false;

        function sendKey(type, code)
        {
            window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true, cancelable: true }));
        }

        function setHeld(code, isHeld)
        {
            if (isHeld === heldCodes.has(code))
            {
                return;
            }

            if (isHeld)
            {
                heldCodes.add(code);
            }
            else
            {
                heldCodes.delete(code);
            }

            sendKey(isHeld ? 'keydown' : 'keyup', code);
        }

        function updateSteer(x, y)
        {
            const dx = x - steerTouch.x;
            const dy = y - steerTouch.y;

            setHeld('ArrowLeft', dx < -deadZone);
            setHeld('ArrowRight', dx > deadZone);
            setHeld('ArrowUp', dy < -deadZone);
            setHeld('ArrowDown', dy > deadZone);

            const length = Math.hypot(dx, dy);
            const scale = length > stickReach ? stickReach / length : 1;

            stickElement.style.setProperty('--dx', (dx * scale) + 'px');
            stickElement.style.setProperty('--dy', (dy * scale) + 'px');
        }

        function releaseSteer()
        {
            steerTouch = null;
            stickElement.hidden = true;

            for (const code of ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'])
            {
                setHeld(code, false);
            }
        }

        function findTouch(touches, id)
        {
            return Array.from(touches).find((touch) => touch.identifier === id);
        }

        touchElement.addEventListener('touchstart', (event) => {
            event.preventDefault();

            sendKey('keydown', 'Space');
            setTimeout(() => sendKey('keyup', 'Space'), 50);

            const rect = touchElement.getBoundingClientRect();

            for (const touch of event.changedTouches)
            {
                if (touch.clientX < rect.left + rect.width / 2)
                {
                    if (steerTouch === null)
                    {
                        steerTouch = { id: touch.identifier, x: touch.clientX, y: touch.clientY };

                        stickElement.style.left = (touch.clientX - rect.left) + 'px';
                        stickElement.style.top = (touch.clientY - rect.top) + 'px';
                        stickElement.style.setProperty('--dx', '0px');
                        stickElement.style.setProperty('--dy', '0px');
                        stickElement.hidden = false;

                        touchElement.classList.add('used');
                    }
                }
                else if (boostTouchId === null)
                {
                    boostTouchId = touch.identifier;
                    setHeld('ShiftLeft', true);
                }
            }
        }, { passive: false });

        touchElement.addEventListener('touchmove', (event) => {
            event.preventDefault();

            const touch = steerTouch !== null ? findTouch(event.changedTouches, steerTouch.id) : undefined;

            if (touch)
            {
                updateSteer(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        function onTouchEnd(event)
        {
            event.preventDefault();

            if (steerTouch !== null && findTouch(event.changedTouches, steerTouch.id))
            {
                releaseSteer();
            }

            if (boostTouchId !== null && findTouch(event.changedTouches, boostTouchId))
            {
                boostTouchId = null;
                setHeld('ShiftLeft', false);
            }

            if (!hasAskedForFullscreen && isRunning && event.type === 'touchend' && frameElement.requestFullscreen)
            {
                hasAskedForFullscreen = true;

                frameElement.requestFullscreen()
                    .then(() => screen.orientation && screen.orientation.lock ? screen.orientation.lock('landscape') : null)
                    .catch(() => {});
            }
        }

        touchElement.addEventListener('touchend', onTouchEnd, { passive: false });
        touchElement.addEventListener('touchcancel', onTouchEnd, { passive: false });
    }

    if (isTouchDevice)
    {
        setUpTouchControls();
    }

    if (!navigator.gpu)
    {
        showStatus('This browser doesn\'t support WebGPU. Please try a recent desktop Chrome or Edge.');
    }
    else if (crossOriginIsolated)
    {
        sessionStorage.removeItem('isolationReload');

        const engineScript = document.createElement('script');
        engineScript.src = 'Glide.js';
        document.body.appendChild(engineScript);
    }
    else if ('serviceWorker' in navigator && isSecureContext && !sessionStorage.getItem('isolationReload'))
    {
        navigator.serviceWorker.register('isolation-worker.js')
            .then(() => navigator.serviceWorker.ready)
            .then(() => {
                sessionStorage.setItem('isolationReload', '1');
                location.reload();
            })
            .catch((error) => showStatus('Couldn\'t start: ' + error));
    }
    else
    {
        showStatus('Couldn\'t enable threads on this page. Try reloading.');
    }
</script>
</body>
</html>
