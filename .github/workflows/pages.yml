name: Deploy site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'HyperionGameTech/HyperionWeb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build docs
        run: npm run build

      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude='/_site' --exclude='/node_modules' --exclude='/docs-src' \
            --exclude='/tools' --exclude='/package*.json' --exclude='/.git*' --exclude='/.opencode' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.repository == 'HyperionGameTech/HyperionWeb'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
